name: Check Pull Request

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read
  packages: read

jobs:
  pr-validator:
    name: Run Pull Request Checks
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      id-token: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Test
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.x
      - name: Restore tools
        run: dotnet tool restore
      - name: Check formatting
        run: dotnet csharpier check .
      - run: dotnet test
  sonarcloud-scan:
    name: CDP SonarCloud Scan
    permissions:
      id-token: write
      pull-requests: write
      contents: read
      packages: read
    uses: ./.github/workflows/sonarcloud.yml
    needs: pr-validator
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
